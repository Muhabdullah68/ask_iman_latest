name: ask_iman
description: ASK Iman - Islamic lifestyle app
publish_to: 'none'
version: 1.0.9+9

environment:
  sdk: '>=3.11.4 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adhan: ^2.0.0+1
  audio_session: ^0.1.25
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.6.12
  cupertino_icons: ^1.0.9
  dio: ^5.9.2
  firebase_auth: ^5.7.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_storage: ^12.4.10
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^17.2.4
  geolocator: ^10.1.1
  go_router: ^16.0.0
  http: ^1.6.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.17
  path: ^1.9.1
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  permission_handler: ^11.4.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  syncfusion_flutter_pdfviewer: ^28.2.12
  timezone: ^0.9.4
  url_launcher: ^6.3.2
  vibration: ^2.0.0

dev_dependencies:
  build_runner: ^2.15.0
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2
  firebase_core_platform_interface: ^6.0.3
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/pdf/surah_pdfs/
    - lib/core/l10n/
    - assets/category_images/

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: fonts/Cairo-Light.ttf
          weight: 300
        - asset: fonts/Cairo-Regular.ttf
          weight: 400
        - asset: fonts/Cairo-Medium.ttf
          weight: 500
        - asset: fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: fonts/Cairo-Bold.ttf
          weight: 700
        - asset: fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: fonts/Cairo-Black.ttf
          weight: 900
    - family: Amiri
      fonts:
        - asset: fonts/Amiri-Regular.ttf
        - asset: fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoNastaliq
      fonts:
        - asset: fonts/NotoNastaliqUrdu-Regular.ttf
    - family: Jameel
      fonts:
        - asset: fonts/Jameel.ttf
    - family: AlQalam
      fonts:
        - asset: fonts/Al Qalam Quran Majeed.ttf
    - family: PDMS_Saleem
      fonts:
        - asset: fonts/_PDMS_Saleem_QuranFont Regular.ttf
    - family: KfgqpcHafs
      fonts:
        - asset: fonts/KfgqpcHafsUthmanicScriptRegular-nARZ1.ttf
    - family: AlMushaf
      fonts:
        - asset: fonts/Al Mushaf Quran.ttf
    - family: AlMajeed
      fonts:
        - asset: fonts/Al Majeed Quranic Font_shiped.ttf
