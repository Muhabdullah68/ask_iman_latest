name: ask_iman
description: "Ask Iman - Islamic lifestyle app"
publish_to: none
version: 1.0.1+2

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI
  shimmer: ^3.0.0
  percent_indicator: ^4.2.5
  cached_network_image: ^3.4.1

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.3.8

  # Networking
  http: ^1.2.1
  url_launcher: ^6.3.1

  # Audio playback for Quran Tilawat
  audioplayers: ^6.0.0

  # Location + Compass
  geolocator: ^10.1.1
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.1

  # Prayers — accurate astronomical calculation (same engine as Athan app)
  adhan: ^2.0.0

  # Persistence
  shared_preferences: ^2.2.2

  # Notifications + scheduling
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # Internationalisation (date formatting for prayer times)
  intl: ^0.19.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2
  firebase_core_platform_interface: ^6.0.0
  build_runner: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/applogo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: fonts/Cairo-Light.ttf
          weight: 300
        - asset: fonts/Cairo-Regular.ttf
          weight: 400
        - asset: fonts/Cairo-Medium.ttf
          weight: 500
        - asset: fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: fonts/Cairo-Bold.ttf
          weight: 700
        - asset: fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: fonts/Cairo-Black.ttf
          weight: 900
    - family: Amiri
      fonts:
        - asset: fonts/Amiri-Regular.ttf
          weight: 400
        - asset: fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoNastaliq
      fonts:
        - asset: fonts/NotoNastaliqUrdu-Regular.ttf
          weight: 400
    - family: AlQalam
      fonts:
        - asset: fonts/Al Qalam Quran Majeed.ttf
          weight: 400