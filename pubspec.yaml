name: ask_iman
description: "Ask Iman - Islamic lifestyle app"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # UI
  shimmer: ^3.0.0
  percent_indicator: ^4.2.5
  cached_network_image: ^3.4.1

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.3.8

  # Networking
  http: ^1.2.1

  # Location + Compass
  geolocator: ^10.1.1
  flutter_compass: ^0.8.0
  permission_handler: ^11.3.1

  # Prayers — accurate astronomical calculation (same engine as Athan app)
  adhan: ^2.0.0

  # Notifications + scheduling
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # Internationalisation (date formatting for prayer times)
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/bgColor.png
    - assets/images/bgcolor.png
    - assets/images/mosque.png
    - assets/images/tasbeeh.png
    - assets/images/Holy Quran.png
    - assets/images/Kaaba.png
    - assets/images/mosque interior.png
    - assets/images/AI orb.png
    - assets/images/tasbih beads.png
    - assets/images/islamic lanterns.png
    - assets/images/masjid_Icon.png
    - assets/images/shaped_Vector.png
    - assets/images/scale_Icon.png
    - assets/images/compass_icon.png
    - assets/images/Compass_Needle.png

  fonts:
    - family: Cairo
      fonts:
        - asset: fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: fonts/Cairo-Light.ttf
          weight: 300
        - asset: fonts/Cairo-Regular.ttf
          weight: 400
        - asset: fonts/Cairo-Medium.ttf
          weight: 500
        - asset: fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: fonts/Cairo-Bold.ttf
          weight: 700
        - asset: fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: fonts/Cairo-Black.ttf
          weight: 900
    - family: Amiri
      fonts:
        - asset: fonts/Amiri-Regular.ttf
          weight: 400
        - asset: fonts/Amiri-Bold.ttf
          weight: 700
    - family: NotoNastaliq
      fonts:
        - asset: fonts/NotoNastaliqUrdu-Regular.ttf
          weight: 400